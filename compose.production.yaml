name: super-mercado-modelo

services:
  supermercado-modelo-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: super-mercado-modelo:production
    container_name: supermercado-modelo-app
    restart: unless-stopped
    expose:
      - "3051"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3051
      DB_PATH: /data/modelo.db
      TRUST_PROXY: "${TRUST_PROXY:-1}"
    volumes:
      - ./data:/data
      - ./downloads:/app/downloads:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    networks:
      - sysclinica-net

networks:
  sysclinica-net:
    external: true
