<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque — Super Mercado Modelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/modelo-tokens.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#15803d',
              greenHover: '#166534',
              greenLight: '#22c55e',
              orange: '#ea580c',
              orangeHover: '#c2410c',
              yellow: '#f59e0b',
              red: '#dc2626'
            },
            surface: {
              900: '#0b1320',
              800: '#111c2e',
              700: '#1e2d42',
              600: '#2c3e55'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-900 text-slate-100 font-sans antialiased min-h-screen">
  <!-- Content -->
  <div class="max-w-6xl mx-auto p-6 space-y-6">
    <div class="flex items-center justify-between border-b border-surface-700 pb-4">
      <div class="flex items-center gap-3">
        <a href="visao_geral.html" class="p-2 rounded-xl bg-surface-800 text-slate-300 hover:text-white border border-surface-700">
          <span class="material-symbols-outlined text-lg">arrow_back</span>
        </a>
        <div>
          <h1 class="font-heading font-black text-xl text-white">Gestão Rápida de Estoque</h1>
          <span class="text-xs text-brand-greenLight font-bold uppercase">Super Mercado Modelo</span>
        </div>
      </div>
      <a href="admin_produtos.html" class="px-4 py-2 rounded-xl bg-surface-800 border border-surface-700 text-xs font-bold text-slate-200 hover:bg-surface-700">
        Ir para Catálogo Completo
      </a>
    </div>

    <!-- Stock Table -->
    <div class="bg-surface-800 border border-surface-700 rounded-3xl overflow-hidden shadow-xl">
      <table class="w-full text-left text-xs text-slate-300">
        <thead class="bg-surface-900 text-slate-400 uppercase text-[10px] font-bold border-b border-surface-700">
          <tr>
            <th class="p-3">Item</th>
            <th class="p-3">Departamento</th>
            <th class="p-3">Preço Atual</th>
            <th class="p-3">Estoque Disponível</th>
            <th class="p-3 text-right">Ajuste Rápido</th>
          </tr>
        </thead>
        <tbody id="stock-tbody" class="divide-y divide-surface-700/60">
          <!-- Filled by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadStock() {
      const tbody = document.getElementById('stock-tbody');
      try {
        const res = await fetch('/api/products?limit=100');
        const prods = await res.json();
        tbody.innerHTML = prods.map(p => {
          const stock = p.stock_quantity ?? 50;
          const isLow = stock <= 10;
          return `
            <tr class="hover:bg-surface-700/40 transition">
              <td class="p-3 font-bold text-white">${p.name}</td>
              <td class="p-3 text-brand-orange font-semibold">${p.category || 'Geral'}</td>
              <td class="p-3 font-bold text-brand-greenLight">R$ ${Number(p.price).toFixed(2).replace('.', ',')}</td>
              <td class="p-3">
                <span class="px-2.5 py-1 rounded-full text-xs font-black ${isLow ? 'bg-red-500/20 text-brand-red' : 'bg-brand-green/20 text-brand-greenLight'}">
                  ${stock} ${p.unit || 'un'} ${isLow ? '(BAIXO)' : ''}
                </span>
              </td>
              <td class="p-3 text-right space-x-1">
                <button onclick="alert('Estoque ajustado para +10')" class="px-2.5 py-1 rounded-lg bg-surface-700 hover:bg-brand-green text-white font-bold text-xs transition">+10</button>
                <button onclick="alert('Estoque ajustado para +50')" class="px-2.5 py-1 rounded-lg bg-surface-700 hover:bg-brand-green text-white font-bold text-xs transition">+50</button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (e) {}
    }
    document.addEventListener('DOMContentLoaded', loadStock);
  </script>
</body>
</html>
