<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso do Gestor — Super Mercado Modelo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/modelo-tokens.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            modelo: {
              green: '#15803d',
              'green-dark': '#166534',
              orange: '#ea580c',
              yellow: '#f59e0b',
              dark: '#0b1320',
              card: '#131f33',
              border: '#1e2f4d'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-modelo-dark text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-modelo-card border border-modelo-border rounded-3xl p-8 shadow-2xl space-y-6">
    <!-- Header with Logo -->
    <div class="text-center space-y-3">
      <div class="flex justify-center mb-2">
        <img src="assets/logo-modelo.png" alt="Super Mercado Modelo" class="h-16 w-auto object-contain drop-shadow-md" />
      </div>
      <h1 class="text-xl font-extrabold text-white tracking-tight">Portal de Gestão Operacional</h1>
      <p class="text-xs text-slate-400">Acesso exclusivo da gerência do Super Mercado Modelo</p>
    </div>

    <!-- Simple Login Form -->
    <form id="form-login-gestor" onsubmit="handleManagerLogin(event)" class="space-y-4">
      <div>
        <label for="gestor-identifier" class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">
          Usuário ou E-mail
        </label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">person</span>
          <input
            id="gestor-identifier"
            type="text"
            required
            autocomplete="username"
            placeholder="admin@supermercadomodelo.com.br"
            value="admin@supermercadomodelo.com.br"
            class="w-full h-12 pl-10 pr-4 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
          />
        </div>
      </div>

      <div>
        <label for="gestor-password" class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">
          Senha de Acesso
        </label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
          <input
            id="gestor-password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            value="admin123"
            class="w-full h-12 pl-10 pr-12 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
          />
          <button type="button" onclick="togglePassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
            <span class="material-symbols-outlined text-lg" id="pwd-icon">visibility</span>
          </button>
        </div>
      </div>

      <div id="login-error" class="hidden p-3 rounded-xl bg-red-950/60 border border-red-800 text-red-300 text-xs font-semibold text-center"></div>

      <button
        type="submit"
        id="btn-login"
        class="w-full h-12 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-bold text-sm transition shadow-lg shadow-emerald-900/40 flex items-center justify-center gap-2 mt-4"
      >
        <span class="material-symbols-outlined text-xl">login</span>
        <span>Entrar no Painel</span>
      </button>
    </form>

    <div class="pt-4 border-t border-slate-800 text-center">
      <a href="index.html" class="text-xs font-semibold text-emerald-400 hover:text-emerald-300 flex items-center justify-center gap-1">
        <span class="material-symbols-outlined text-sm">storefront</span>
        <span>Acessar vitrine do cliente</span>
      </a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('gestor-password');
      const icon = document.getElementById('pwd-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    async function handleManagerLogin(event) {
      event.preventDefault();
      const identifier = document.getElementById('gestor-identifier').value.trim();
      const password = document.getElementById('gestor-password').value;
      const errorBox = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');

      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';

      try {
        const res = await fetch('/api/auth/login-manager', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: identifier, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', JSON.stringify(data.user));
          localStorage.setItem('adminStore', JSON.stringify(data.store || { name: 'Super Mercado Modelo' }));
          window.location.href = 'visao_geral.html';
        } else {
          errorBox.innerText = data.error || 'Credenciais inválidas.';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.innerText = 'Erro de conexão com o servidor.';
        errorBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-xl">login</span><span>Entrar no Painel</span>';
      }
    }
  </script>
</body>
</html>
