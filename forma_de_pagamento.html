<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento & Conclusão — Super Mercado Modelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/modelo-tokens.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#15803d',
              greenHover: '#166534',
              greenLight: '#22c55e',
              orange: '#ea580c',
              orangeHover: '#c2410c',
              yellow: '#f59e0b',
              red: '#dc2626'
            },
            surface: {
              900: '#0b1320',
              800: '#111c2e',
              700: '#1e2d42',
              600: '#2c3e55'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-900 text-slate-100 font-sans antialiased min-h-screen pb-20 selection:bg-brand-orange selection:text-white">

  <!-- Top Header -->
  <header class="sticky top-0 z-50 bg-surface-800/95 backdrop-blur-md border-b border-surface-700/80 shadow-md">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="meu_carrinho.html" class="flex items-center gap-2 text-slate-300 hover:text-white font-semibold text-xs transition">
        <span class="material-symbols-outlined text-lg">arrow_back</span>
        <span>Voltar à Sacola</span>
      </a>
      <div class="flex items-center gap-2">
        <img src="assets/logo-modelo.png" alt="Super Mercado Modelo" class="h-8 w-8 object-contain">
        <span class="font-heading font-black text-sm text-white">Super Mercado <span class="text-brand-orange">Modelo</span></span>
      </div>
    </div>
  </header>

  <!-- Step Bar -->
  <div class="bg-surface-800 border-b border-surface-700 py-3">
    <div class="max-w-3xl mx-auto px-4 flex items-center justify-between text-xs font-bold">
      <div class="flex items-center gap-2 text-brand-greenLight">
        <span class="w-6 h-6 rounded-full bg-brand-green text-white flex items-center justify-center text-[11px]">✓</span>
        <span>Sacola</span>
      </div>
      <div class="h-0.5 flex-1 mx-4 bg-brand-green"></div>
      <div class="flex items-center gap-2 text-brand-greenLight">
        <span class="w-6 h-6 rounded-full bg-brand-green text-white flex items-center justify-center text-[11px]">2</span>
        <span>Pagamento & Entrega</span>
      </div>
      <div class="h-0.5 flex-1 mx-4 bg-surface-700"></div>
      <div class="flex items-center gap-2 text-slate-500">
        <span class="w-6 h-6 rounded-full bg-surface-700 text-slate-400 flex items-center justify-center text-[11px]">3</span>
        <span>Confirmação</span>
      </div>
    </div>
  </div>

  <main class="max-w-3xl mx-auto px-4 pt-6 space-y-6">
    <div>
      <h1 class="font-heading font-black text-2xl text-white">Como deseja pagar?</h1>
      <p class="text-xs text-slate-400">Escolha a forma mais conveniente para receber seu pedido.</p>
    </div>

    <!-- Payment Methods Selection -->
    <div class="space-y-3">
      
      <!-- PIX -->
      <label class="payment-option block p-4 rounded-2xl bg-surface-800 border-2 border-surface-700 hover:border-brand-green cursor-pointer transition">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <input type="radio" name="payment_method" value="PIX" checked class="w-4 h-4 text-brand-green focus:ring-brand-green bg-surface-900 border-surface-600">
            <div>
              <span class="font-heading font-bold text-sm text-white block">PIX (Chave ou QR Code)</span>
              <span class="text-xs text-brand-greenLight font-semibold">Aprovação imediata e separação prioritária</span>
            </div>
          </div>
          <span class="material-symbols-outlined text-brand-greenLight text-2xl">qr_code_2</span>
        </div>
      </label>

      <!-- Cartão na Entrega -->
      <label class="payment-option block p-4 rounded-2xl bg-surface-800 border-2 border-surface-700 hover:border-brand-green cursor-pointer transition">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <input type="radio" name="payment_method" value="CARTAO_ENTREGA" class="w-4 h-4 text-brand-green focus:ring-brand-green bg-surface-900 border-surface-600">
            <div>
              <span class="font-heading font-bold text-sm text-white block">Cartão na Entrega (Débito ou Crédito)</span>
              <span class="text-xs text-slate-400">O entregador levará a maquininha até você</span>
            </div>
          </div>
          <span class="material-symbols-outlined text-brand-orange text-2xl">credit_card</span>
        </div>
      </label>

      <!-- Dinheiro -->
      <label class="payment-option block p-4 rounded-2xl bg-surface-800 border-2 border-surface-700 hover:border-brand-green cursor-pointer transition">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <input type="radio" name="payment_method" value="DINHEIRO" class="w-4 h-4 text-brand-green focus:ring-brand-green bg-surface-900 border-surface-600">
            <div>
              <span class="font-heading font-bold text-sm text-white block">Dinheiro</span>
              <span class="text-xs text-slate-400">Pagamento em espécie na entrega</span>
            </div>
          </div>
          <span class="material-symbols-outlined text-brand-yellow text-2xl">payments</span>
        </div>
      </label>

    </div>

    <!-- Delivery Address & Observation -->
    <div class="bg-surface-800 border border-surface-700 rounded-2xl p-5 space-y-4 shadow-lg">
      <h3 class="font-heading font-bold text-sm text-white border-b border-surface-700 pb-2 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-brand-orange text-lg">local_shipping</span>
        Dados de Entrega & Contato
      </h3>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-300">Seu Nome Completo *</label>
          <input type="text" id="order-customer-name" placeholder="Ex: Maria da Silva" class="w-full h-11 px-3 rounded-xl bg-surface-900 border border-surface-600 text-xs text-white focus:outline-none focus:border-brand-green">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-300">WhatsApp para Notificações *</label>
          <input type="text" id="order-customer-phone" placeholder="Ex: (85) 99999-9999" class="w-full h-11 px-3 rounded-xl bg-surface-900 border border-surface-600 text-xs text-white focus:outline-none focus:border-brand-green">
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Endereço Completo de Entrega (Rua, Número, Bairro) *</label>
        <input type="text" id="order-customer-address" placeholder="Ex: Rua Cel. José de Castro, 240, Centro, Cascavel - CE" class="w-full h-11 px-3 rounded-xl bg-surface-900 border border-surface-600 text-xs text-white focus:outline-none focus:border-brand-green">
      </div>

      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Ponto de Referência ou Observação</label>
        <input type="text" id="order-customer-obs" placeholder="Ex: Próximo à praça central, interfone 201" class="w-full h-11 px-3 rounded-xl bg-surface-900 border border-surface-600 text-xs text-white focus:outline-none focus:border-brand-green">
      </div>
    </div>

    <!-- Total and Submit Action -->
    <div class="bg-surface-800 border border-surface-700 rounded-2xl p-5 shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <span class="text-xs text-slate-400 block">Total do Pedido com Entrega:</span>
        <span id="final-total-display" class="font-heading font-black text-2xl text-brand-greenLight">R$ 0,00</span>
      </div>

      <button id="submit-order-btn" onclick="submitOrder()" class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-brand-green hover:bg-brand-greenHover text-white font-heading font-black text-sm shadow-lg shadow-brand-green/30 flex items-center justify-center gap-2 transition active:scale-95 disabled:opacity-50">
        <span class="material-symbols-outlined text-lg">check_circle</span>
        <span>Confirmar e Enviar Pedido</span>
      </button>
    </div>

  </main>

  <script>
    function getCart() {
      try {
        const raw = localStorage.getItem('modelo_cart');
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function initForm() {
      const cart = getCart();
      if (cart.length === 0) {
        window.location.href = 'index.html';
        return;
      }

      const subtotal = cart.reduce((sum, i) => sum + ((Number(i.price) || 0) * (Number(i.quantity) || 0)), 0);
      const delivery = 5.00;
      const total = subtotal + delivery;

      document.getElementById('final-total-display').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;

      // Pre-fill user data if logged in
      try {
        const userJson = localStorage.getItem('customerUser') || localStorage.getItem('user');
        if (userJson) {
          const user = JSON.parse(userJson);
          if (user.name || user.fullname) {
            document.getElementById('order-customer-name').value = user.name || user.fullname;
          }
          if (user.phone) {
            document.getElementById('order-customer-phone').value = user.phone;
          }
        }
      } catch (e) {}

      const savedAddr = localStorage.getItem('modelo_address');
      if (savedAddr) {
        document.getElementById('order-customer-address').value = savedAddr;
      }
    }

    async function submitOrder() {
      const btn = document.getElementById('submit-order-btn');
      const cart = getCart();

      const name = document.getElementById('order-customer-name').value.trim();
      const phone = document.getElementById('order-customer-phone').value.trim();
      const address = document.getElementById('order-customer-address').value.trim();
      const notes = document.getElementById('order-customer-obs').value.trim();

      const paymentRadio = document.querySelector('input[name="payment_method"]:checked');
      const paymentMethod = paymentRadio ? paymentRadio.value : 'PIX';

      if (!name || !phone || !address) {
        alert('Por favor, preencha seu nome, telefone e endereço completo de entrega.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-lg animate-spin">progress_activity</span> Gravando pedido...';

      try {
        const token = localStorage.getItem('customerToken') || localStorage.getItem('token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({
            items: cart.map(i => ({
              id: i.id,
              quantity: i.quantity
            })),
            customer_name: name,
            customer_phone: phone,
            delivery_address: address,
            payment_method: paymentMethod,
            delivery_fee: 5.00,
            notes: notes
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Erro ao processar o pedido');
        }

        // Clear Cart
        localStorage.removeItem('modelo_cart');

        // Redirect to confirmation
        window.location.href = `pedido_confirmado.html?orderId=${data.order.id}&orderNumber=${encodeURIComponent(data.order.order_number)}`;

      } catch (err) {
        alert('Erro ao enviar pedido: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-lg">check_circle</span> <span>Confirmar e Enviar Pedido</span>';
      }
    }

    document.addEventListener('DOMContentLoaded', initForm);
  </script>
</body>
</html>
