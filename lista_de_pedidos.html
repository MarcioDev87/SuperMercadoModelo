<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — Super Mercado Modelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/modelo-tokens.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#15803d',
              greenHover: '#166534',
              greenLight: '#22c55e',
              orange: '#ea580c',
              orangeHover: '#c2410c',
              yellow: '#f59e0b',
              red: '#dc2626'
            },
            surface: {
              900: '#0b1320',
              800: '#111c2e',
              700: '#1e2d42',
              600: '#2c3e55'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-900 text-slate-100 font-sans antialiased min-h-screen">
  <div class="max-w-6xl mx-auto p-6 space-y-6">
    <div class="flex items-center justify-between border-b border-surface-700 pb-4">
      <div class="flex items-center gap-3">
        <a href="visao_geral.html" class="p-2 rounded-xl bg-surface-800 text-slate-300 hover:text-white border border-surface-700">
          <span class="material-symbols-outlined text-lg">arrow_back</span>
        </a>
        <div>
          <h1 class="font-heading font-black text-xl text-white">Fila de Pedidos em Tempo Real</h1>
          <span class="text-xs text-brand-greenLight font-bold uppercase">Super Mercado Modelo</span>
        </div>
      </div>
      <button onclick="fetchOrders()" class="px-4 py-2 rounded-xl bg-brand-green text-white font-bold text-xs flex items-center gap-1.5 shadow">
        <span class="material-symbols-outlined text-base">refresh</span>
        <span>Atualizar Fila</span>
      </button>
    </div>

    <!-- Orders Container -->
    <div id="orders-list-container" class="space-y-3">
      <!-- Filled by JS -->
    </div>
  </div>

  <script>
    async function fetchOrders() {
      const container = document.getElementById('orders-list-container');
      const token = localStorage.getItem('adminToken');
      try {
        const res = await fetch('/api/orders', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const orders = await res.json();
        if (!orders || orders.length === 0) {
          container.innerHTML = '<div class="p-10 text-center text-slate-400 bg-surface-800 rounded-2xl border border-surface-700">Nenhum pedido pendente na fila.</div>';
          return;
        }

        container.innerHTML = orders.map(o => {
          return `
            <div class="bg-surface-800 border border-surface-700 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="font-heading font-black text-base text-brand-orange">${o.order_number}</span>
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-brand-green/20 text-brand-greenLight">${o.status}</span>
                </div>
                <h4 class="font-bold text-xs text-white">${o.customer_name} • ${o.customer_phone}</h4>
                <p class="text-[11px] text-slate-400">${o.delivery_address}</p>
              </div>

              <div class="flex items-center gap-3 shrink-0 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 border-surface-700 pt-2 sm:pt-0">
                <div class="text-right">
                  <span class="text-[10px] text-slate-400 block">Total</span>
                  <span class="font-heading font-black text-base text-brand-greenLight">R$ ${Number(o.total_amount).toFixed(2).replace('.', ',')}</span>
                </div>
                <select onchange="updateOrderStatus('${o.id}', this.value)" class="h-9 px-2 rounded-xl bg-surface-900 border border-surface-600 text-xs text-white">
                  <option value="CRIADO" ${o.status === 'CRIADO' ? 'selected' : ''}>Novo</option>
                  <option value="CONFIRMADO" ${o.status === 'CONFIRMADO' ? 'selected' : ''}>Confirmado</option>
                  <option value="EM_SEPARACAO" ${o.status === 'EM_SEPARACAO' ? 'selected' : ''}>Separando</option>
                  <option value="SAIU_ENTREGA" ${o.status === 'SAIU_ENTREGA' ? 'selected' : ''}>Em Rota</option>
                  <option value="ENTREGUE" ${o.status === 'ENTREGUE' ? 'selected' : ''}>Entregue</option>
                  <option value="CANCELADO" ${o.status === 'CANCELADO' ? 'selected' : ''}>Cancelado</option>
                </select>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {}
    }

    async function updateOrderStatus(id, status) {
      const token = localStorage.getItem('adminToken');
      try {
        await fetch(`/api/orders/${id}/status`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status })
        });
        fetchOrders();
      } catch (e) {
        alert('Erro ao atualizar status');
      }
    }

    document.addEventListener('DOMContentLoaded', fetchOrders);
  </script>
</body>
</html>
