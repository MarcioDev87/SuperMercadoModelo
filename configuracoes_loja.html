<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Configurações da Loja — Super Mercado Modelo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/modelo-tokens.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="bg-slate-950 text-slate-100 p-6">
  <div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-3 border-b border-slate-800 pb-4">
      <a href="visao_geral.html" class="p-2 bg-slate-900 rounded-xl border border-slate-800">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
      </a>
      <h1 class="text-xl font-bold">Parâmetros do Super Mercado Modelo</h1>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 text-xs">
      <div>
        <label class="font-bold text-slate-300 block mb-1">Nome Fantasia Oficial</label>
        <input type="text" value="Super Mercado Modelo" class="w-full h-10 px-3 rounded-xl bg-slate-950 border border-slate-700 text-white" readonly>
      </div>
      <div>
        <label class="font-bold text-slate-300 block mb-1">Cidade / Estado</label>
        <input type="text" value="Cascavel - CE" class="w-full h-10 px-3 rounded-xl bg-slate-950 border border-slate-700 text-white" readonly>
      </div>
      <div>
        <label class="font-bold text-slate-300 block mb-1">Taxa Padrão de Entrega (R$)</label>
        <input type="number" step="0.50" value="5.00" class="w-full h-10 px-3 rounded-xl bg-slate-950 border border-slate-700 text-white">
      </div>
      <div>
        <label class="font-bold text-slate-300 block mb-1">WhatsApp de Contato da Loja</label>
        <input type="text" value="(85) 99999-9999" class="w-full h-10 px-3 rounded-xl bg-slate-950 border border-slate-700 text-white">
      </div>
      <button onclick="alert('Configurações salvas!')" class="w-full py-3 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-bold transition">
        Salvar Alterações
      </button>
    </div>
  </div>
</body>
</html>
